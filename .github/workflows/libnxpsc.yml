name: libnxpsc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is Linux on aarch64 (the Docker/Kubernetes arm64 case)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        cc: [gcc, clang]
        arch: [native]
        include:
          - os: windows-latest
            cc: msvc
            arch: native
          # osx-x64: cross compiled on the arm64 runner (the Intel images are
          # being retired). the x86_64 binaries run under Rosetta 2
          - os: macos-latest
            cc: gcc
            arch: x86_64
          - os: macos-latest
            cc: clang
            arch: x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" = "msvc" ]; then
            cmake -S . -B build
          else
            extra=""
            if [ "${{ matrix.arch }}" != "native" ]; then
              extra="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}"
            fi
            CC=${{ matrix.cc }} cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Verify the target architecture
        if: matrix.arch != 'native'
        run: lipo -archs "$(find build -name 'libnxpsc*.dylib' | head -n 1)" | grep -qx "${{ matrix.arch }}"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

      # the installed layout is the distribution: bin/ (DLLs), lib/ (static and
      # import libraries, shared objects), include/nxpsc/nxpsc.h
      - name: Install
        run: cmake --install build --config Release --prefix dist

      # an MSVC nxpsc.dll once shipped with an empty export table. fail the
      # build if the shared library does not export its public API
      - name: Check the shared library exports
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows)
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              dumpbin="$("$vswhere" -latest -find '**/Hostx64/x64/dumpbin.exe' | head -n 1 | tr -d '\r')"
              "$dumpbin" -exports dist/bin/nxpsc.dll > exports.txt
              ;;
            macOS)
              nm -gU "$(find dist -name 'libnxpsc*.dylib' | head -n 1)" > exports.txt
              ;;
            *)
              nm -D --defined-only "$(find dist -name 'libnxpsc.so*' -type f | head -n 1)" > exports.txt
              ;;
          esac
          for sym in nxpsc_open nxpsc_close nxpsc_selftest nxpsc_authenticate nxpsc_diversify_an10922; do
            grep -q "$sym" exports.txt || { echo "::error::$sym is not exported by the shared library"; exit 1; }
          done
          echo "$(grep -c 'nxpsc_' exports.txt) nxpsc_ symbols exported"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: libnxpsc-dist-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: libnxpsc-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.arch }}
          path: |
            build/**/*.a
            build/**/*.so
            build/**/*.dylib
            build/**/*.dll
            build/**/*.lib
            build/**/*.exe
          if-no-files-found: warn

      - name: Upload test logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.arch }}
          path: build/Testing/
          if-no-files-found: ignore

  warnings:
    name: warning free build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Build with warnings as errors
        run: |
          CC=${{ matrix.cc }} cmake -S . -B build -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
          cd build && ctest --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: libnxpsc-warnings-${{ matrix.cc }}
          path: |
            build/**/*.a
            build/**/*.so
          if-no-files-found: warn
